[project]
name = "pex"
version = "0.1.0"
description = "Goal-aware adaptive supervisor for existing AI coding agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "PEX" }]
dependencies = [
  "pex-protocol",
  "pex-bridge",
  "pex-supervisor",
]

[project.scripts]
pex-bridge = "pex_bridge.main:main"
pex-supervisor = "pex_supervisor.runtime:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "pyinstaller>=6.16",
  "ruff>=0.9",
]

[tool.uv.workspace]
members = [
  "packages/protocol",
  "services/bridge",
  "services/supervisor",
]

[tool.uv.sources]
pex-protocol = { workspace = true }
pex-bridge = { workspace = true }
pex-supervisor = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "live_llm: hits a real supervisor provider; requires PEX_LIVE_SUPERVISOR=1",
  "live_codex: hits a real Codex App Server; requires PEX_LIVE_CODEX=1",
  "live_opencode: hits an existing OpenCode server; requires PEX_LIVE_OPENCODE=1",
  "live_agentcore: invokes a deployed AgentCore Runtime; requires PEX_AGENTCORE_LIVE=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
