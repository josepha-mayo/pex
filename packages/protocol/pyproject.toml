[project]
name = "pex-protocol"
version = "0.1.0"
description = "Typed shared schemas for the PEX control plane."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pex_protocol"]
