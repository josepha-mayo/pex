version: 2
frozen: false
suite:
  kind: deterministic_mixed_source_development_smoke
  minimum_tasks: 8
  task_count: 8
  natural_task_source_status: not_yet_satisfied
  natural_task_package_status: satisfied
  task_execution_boundary: controlled_fixtures_only
  limitation: >-
    Five tasks are deterministic repository-shaped PEX management stressors. Three additional
    tasks are source- and license-pinned reproductions from the public QuixBugs program-repair
    benchmark. Natural-source packaging is satisfied, but execution remains controlled fixtures:
    untrusted repository code requires an isolated worker boundary that cannot read controller
    or hidden-evaluator files. Do not describe the natural-task source gate as satisfied until
    that execution boundary exists.
  required_stressors:
  - premature_stop
  - forgotten_acceptance
  - permission_interruption
  - cross_session_handoff
  - false_completion
arms:
- cursor
- cursor_pex
- codex
- codex_pex
primary_metric: task_success
secondary_metric: human_interventions_per_success
include_pex_overhead: true
integrity:
  raw_harness_event_log_status: not_yet_satisfied
  cursor_same_session_treatment_status: not_yet_satisfied
  source_repo_commit_capture_status: satisfied
  note: >-
    The controller hashes its captured event subset, but it does not yet retain and bind a
    complete vendor raw event log. A final presentation freeze must fail closed until that
    capture path exists.
protocol:
  schema_version: 1
  randomization:
    algorithm: sha256_sorted_paired_blocks_v1
    seed: pexbench-v2-four-arm-order-2026-08-27
    block: task_within_harness
    within_block: sha256_condition_order
  budget:
    regime: natural_completion
    task_wall_seconds: 600
    includes_worker_and_pex: true
    evaluator_outside_task_budget: true
    max_pex_followups: 2
    max_supervisor_decision_seconds: 180
  network_policy:
    codex: workspace_write_network_disabled
    cursor: unchanged_between_pairs_but_not_controller_verified
  rerun_policy:
    selective_reruns: forbidden
    completed_task_reruns: forbidden
    infrastructure_abort_recovery: restart_entire_experiment_with_new_run_id
    retain_aborted_raw_run: true
  abort_policy:
    abort_entire_run_on:
    - vendor_outage
    - harness_disconnect
    - controller_crash
    - budget_exhaustion
    - provenance_failure
    - operator_intervention
    preserve_partial_jsonl: true
    resume_same_run_id: false
  reporting:
    require_complete_coherent_run: true
    primary_test: exact_mcnemar
    paired_lift_interval: deterministic_paired_bootstrap_95
    marginal_interval: wilson_95
    bootstrap_seed: pexbench-v2-report-bootstrap-2026-08-27
tasks:
- id: pexbench_001_premature_stop
  type: premature_stop
- id: pexbench_002_drift
  type: forgotten_acceptance
- id: pexbench_003_permission_spam
  type: permission_interruption
- id: pexbench_004_false_claim
  type: false_completion
- id: pexbench_005_handoff
  type: cross_session_handoff
- id: pexbench_006_quixbugs_wrap
  type: natural_bug
- id: pexbench_007_quixbugs_next_permutation
  type: natural_bug
- id: pexbench_008_quixbugs_kth
  type: natural_bug
