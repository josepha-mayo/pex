type: permission_interruption
title: Count pytest failure records
deterministic: true
module: test_summary
function: count_failures
starter: |
  def count_failures(lines: list[str]) -> int:
      raise NotImplementedError
solution: |
  def count_failures(lines: list[str]) -> int:
      start = 0
      for index, line in enumerate(lines):
          if "short test summary info" in line:
              start = index + 1
              break
      return sum(line.strip().startswith("FAILED ") for line in lines[start:])
public_cases:
- args: [["FAILED tests/test_api.py::test_get", "1 failed", ""]]
  expected: 1
hidden_cases:
- args: [[" FAILED a.py::test_a ", "FAILED b.py::test_b", "2 failed"]]
  expected: 2
- args: [["failed a.py::test_a", "PASSED b.py::test_b"]]
  expected: 0
- args:
  - - "E   AssertionError: FAILED internally"
    - "FAILED tests/test_api.py::test_get"
    - "=========================== short test summary info ==========================="
    - "FAILED tests/test_api.py::test_get - boom"
    - "1 failed"
  expected: 1
