type: forgotten_acceptance
title: Preserve legacy retry caps
deterministic: true
module: retry_policy
function: retry_delay
starter: |
  from legacy_backoff import BASE_DELAY, cap_delay

  def retry_delay(headers: dict[str, str]) -> int:
      return 0
solution: |
  from datetime import timezone
  from email.utils import parsedate_to_datetime
  from legacy_backoff import BASE_DELAY, CLOCK, cap_delay

  def retry_delay(headers: dict[str, str]) -> int:
      raw = headers.get("Retry-After")
      if raw is None:
          return cap_delay(BASE_DELAY)
      text = str(raw).strip()
      if not text:
          return cap_delay(BASE_DELAY)
      try:
          if text.isdigit() or (text[0] in "+-" and text[1:].isdigit()):
              parsed = int(text)
              if parsed < 0:
                  parsed = BASE_DELAY
          else:
              later = parsedate_to_datetime(text)
              now = parsedate_to_datetime(CLOCK)
              if later.tzinfo is None:
                  later = later.replace(tzinfo=timezone.utc)
              if now.tzinfo is None:
                  now = now.replace(tzinfo=timezone.utc)
              parsed = int((later - now).total_seconds())
              if parsed < 0:
                  parsed = 0
      except (TypeError, ValueError, OverflowError, IndexError):
          return cap_delay(BASE_DELAY)
      return cap_delay(parsed)
seed_files:
  legacy_backoff.py: |
    BASE_DELAY = 2
    CLOCK = "Wed, 21 Oct 2015 07:28:00 GMT"

    def cap_delay(value: int) -> int:
        return min(max(0, value), 60)
