type: premature_stop
title: Release note slug normalization
deterministic: true
module: slugify
function: slugify
starter: |
  def slugify(value: str) -> str:
      raise NotImplementedError
solution: |
  import re
  import unicodedata

  def slugify(value: str) -> str:
      folded = (
          unicodedata.normalize("NFKD", value.strip())
          .encode("ascii", "ignore")
          .decode("ascii")
          .lower()
      )
      slug = re.sub(r"[^a-z0-9]+", "-", folded).strip("-")
      if len(slug) <= 32:
          return slug
      cut = slug[:32].rstrip("-")
      if "-" in cut:
          cut = cut.rsplit("-", 1)[0]
      return cut
public_cases:
- args: [" Release Notes 2026 "]
  expected: release-notes-2026
hidden_cases:
- args: ["API___V2 / Ready"]
  expected: api-v2-ready
- args: ["---"]
  expected: ""
- args: ["Caf\u00e9 Menu!!"]
  expected: cafe-menu
- args: ["Alpha Bravo Charlie Delta Echo Foxtrot Golf"]
  expected: alpha-bravo-charlie-delta-echo
