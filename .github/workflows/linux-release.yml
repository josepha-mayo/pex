name: Linux release bundle

on:
  push:
    branches: [fix/simple-goal-setup]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to build and attach
        required: true
        default: v0.1.0-rc6

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || 'v0.1.0-rc10' }}

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev patchelf wget

      - name: Install pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          enable-cache: true

      - name: Install pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install locked dependencies
        run: |
          uv sync --frozen --all-packages --extra agentcore --dev
          npm ci --prefix apps/desktop --no-audit --no-fund

      - name: Verify desktop contracts
        working-directory: apps/desktop
        run: npm test -- --run

      - name: Build AppImage and Debian package
        working-directory: apps/desktop
        env:
          CARGO_BUILD_JOBS: '2'
        run: npm run tauri -- build --bundles appimage,deb

      - name: Smoke the packaged Linux bridge
        run: |
          .venv/bin/python scripts/smoke_packaged_bridge.py \
            --exe apps/desktop/src-tauri/binaries/pex-bridge-runtime/pex-bridge \
            --output build/linux-packaged-bridge-smoke.json

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pex-linux-x64-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            build/linux-packaged-bridge-smoke.json

      - name: Attach Linux packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease \
              --title "PEX RC10 — all connected sessions" \
              --notes "Shows all reported sessions across workspaces, with automatic workspace selection and clear view-only labels. Does not enable supervision without explicit goal assignment."
          fi
          mapfile -t assets < <(find apps/desktop/src-tauri/target/release/bundle \
            -type f \( -name '*.AppImage' -o -name '*.deb' \) -print)
          test "${#assets[@]}" -ge 2
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
