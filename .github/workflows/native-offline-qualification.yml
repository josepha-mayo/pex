# Third separately approved offline check; executable-only provisioning.
# No package installation scripts or system policy files. No provider requests.
name: Native OpenCode offline containment qualification
on:
  push:
    branches: [review/native-offline-qualification-20261021]
    paths: [.github/workflows/native-offline-qualification.yml]
permissions:
  contents: read
concurrency:
  group: native-offline-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'josepha-mayo/pex' && github.event.repository.private == false && github.ref == 'refs/heads/review/native-offline-qualification-20261021'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: c93b5add5f6262aff915d616ed36142062bdf60b # exact source tree verified before activation
          persist-credentials: false
          fetch-depth: 1
      - name: Provision only verified official unprivileged sandbox executable
        run: |
          set -eu
          if test -e /usr/bin/bwrap || test -L /usr/bin/bwrap; then
            stat -c 'existing bwrap owner=%u mode=%a type=%F' /usr/bin/bwrap
            echo 'Refusing to replace an existing binary; fresh-runner premise changed'
            exit 1
          fi
          echo 'Verified /usr/bin/bwrap absent'
          sudo apt-get -o APT::Update::Error-Mode=any update
          apt-cache policy bubblewrap
          mkdir "$RUNNER_TEMP/bubblewrap-executable-only"
          cd "$RUNNER_TEMP/bubblewrap-executable-only"
          apt-get --print-uris download bubblewrap=0.9.0-1ubuntu0.3 > uris.txt
          cat uris.txt
          apt-get download bubblewrap=0.9.0-1ubuntu0.3
          cat > validate.py <<'PYVALIDATE'
          """Pure validation and extraction only. Never installs or executes package code."""
          import hashlib, io, pathlib, shlex, stat, subprocess, tarfile, urllib.parse
          PACKAGE_SHA512='16cad315aa5a302ee8573c8ccb7e6adcdf5bd10dd29adeed0f7f061f39f7b52159d4020b2db1b1dde88fa7f7a3f54522d83037266c956a346882e234247c790b'
          BINARY_SHA256='e318903862396f96de3df57264e0158682b952fd3fb53ac23d876413e7b30f71'
          FILENAME='bubblewrap_0.9.0-1ubuntu0.3_amd64.deb'
          def official(uri):
           p=urllib.parse.urlparse(uri);h=p.hostname
           return p.scheme in {'http','https'} and not p.username and not p.password and p.port in {None,80,443} and h is not None and (h in {'archive.ubuntu.com','security.ubuntu.com'} or h.endswith('.archive.ubuntu.com'))
          def receipt(text,mirror_text=None):
           lines=text.strip().splitlines()
           if len(lines)!=1: raise ValueError('unexpected URI count')
           fields=shlex.split(lines[0])
           if len(fields)!=4 or fields[1:]!=[FILENAME,'50436','SHA512:'+PACKAGE_SHA512]: raise ValueError('receipt does not match reviewed package')
           uri=fields[0]
           prefix='mirror+file:/etc/apt/apt-mirrors.txt/'
           if uri.startswith(prefix):
            if uri[len(prefix):]!='pool/main/b/bubblewrap/'+FILENAME: raise ValueError('unexpected mirror path')
            entries=[line.split()[0] for line in (mirror_text or '').splitlines() if line.strip() and not line.lstrip().startswith('#')]
            if not entries or not all(official(v) for v in entries): raise ValueError('unreviewed mirror list')
           elif not official(uri): raise ValueError('unreviewed package URI')
           return fields
          
          def extract(data):
           if len(data)!=50436 or hashlib.sha512(data).hexdigest()!=PACKAGE_SHA512: raise ValueError('package mismatch')
           # dpkg-deb reads the archive only; no package scripts or executable run.
           result=subprocess.run(['dpkg-deb','--fsys-tarfile','-'],input=data,stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True,timeout=15)
           with tarfile.open(fileobj=io.BytesIO(result.stdout)) as archive:
            matches=[m for m in archive.getmembers() if m.name=='./usr/bin/bwrap']
            if len(matches)!=1: raise ValueError('binary entry count')
            item=matches[0]
            if not item.isfile() or item.mode!=0o755 or item.uid!=0 or item.gid!=0 or item.pax_headers: raise ValueError('unexpected executable metadata')
            binary=archive.extractfile(item).read()
           if hashlib.sha256(binary).hexdigest()!=BINARY_SHA256: raise ValueError('binary mismatch')
           return binary
          if __name__=='__main__':
           lines=pathlib.Path('uris.txt').read_text()
           mirror=pathlib.Path('/etc/apt/apt-mirrors.txt')
           mirror_text=None
           if 'mirror+file:' in lines:
            info=mirror.lstat()
            if not stat.S_ISREG(info.st_mode) or info.st_uid!=0 or info.st_mode & 0o022: raise ValueError('untrusted mirror list file')
            mirror_text=mirror.read_text()
           receipt(lines,mirror_text)
           pathlib.Path('bwrap').write_bytes(extract(pathlib.Path(FILENAME).read_bytes()))
           print('Exact authenticated package and executable verified; no maintainer scripts or policy files extracted')
          PYVALIDATE
          python3 validate.py
          # Install only this vetted regular executable. No dpkg/apt install or postinst.
          sudo install -o root -g root -m 0755 -- bwrap /usr/bin/bwrap
          python3 - <<'PYCHECK'
          import hashlib,os,pathlib,stat
          p=pathlib.Path('/usr/bin/bwrap');m=p.lstat()
          assert stat.S_ISREG(m.st_mode) and m.st_uid==0 and m.st_gid==0
          assert stat.S_IMODE(m.st_mode)==0o755
          assert 'security.capability' not in os.listxattr(p)
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='e318903862396f96de3df57264e0158682b952fd3fb53ac23d876413e7b30f71'
          print('root-owned0755 binary verified; no capabilities')
          PYCHECK
          /usr/bin/bwrap --version
          uname -r
      - name: Fetch exact official binary without installation scripts
        env:
          QUAL_RUNTIME: ${{ runner.temp }}/native-qualification-runtime
        run: |
          set -eu
          mkdir "$QUAL_RUNTIME"
          curl --fail --silent --show-error --location \
            https://registry.npmjs.org/opencode-linux-x64/-/opencode-linux-x64-1.19.3.tgz \
            --output "$QUAL_RUNTIME/package.tgz"
          python3 - <<'PY'
          import base64, hashlib, io, os, pathlib, tarfile
          root = pathlib.Path(os.environ['QUAL_RUNTIME'])
          data = (root / 'package.tgz').read_bytes()
          expected = 'wz+kXi7ZkvLW04hEIocW3RoEznALJ3YGnvNlZdXFarYF0v1jyDyAwpPGZkxb4JZDrw4oy48/LDZ8wCFIQDTxhw=='
          assert base64.b64encode(hashlib.sha512(data).digest()).decode() == expected
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              item = archive.getmember('package/bin/opencode')
              assert item.isfile() and item.size <= 256 * 1024 * 1024
              binary = archive.extractfile(item).read()
          assert hashlib.sha256(binary).hexdigest() == '179ca421d61eefeadfa0c50e084a6e79c1623734732f0f4593f81ccfd3ab7ee9'
          (root / 'opencode').write_bytes(binary)
          (root / 'opencode').chmod(0o555)
          (root / 'package.tgz').unlink()
          PY
      - name: Exercise real native startup inside unchanged network-isolated boundary
        env:
          QUAL_RUNTIME: ${{ runner.temp }}/native-qualification-runtime
        run: |
          set -eu
          env -i PATH=/usr/bin:/bin \
            /usr/bin/python3 scripts/qualify_native_offline.py --runtime "$QUAL_RUNTIME"
      # Deliberately no upload-artifact, provider/model credentials, deployment,
      # privileged container, sysctl, AppArmor/setuid changes or release gate.
      # Explicitly approved copy of one vetted executable uses sudo; no package installation.

