name: Windows and Linux checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
          enable-cache: true
      - name: Install pinned standalone Python
        run: uv python install
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install locked Python dependencies
        run: uv sync --frozen --all-packages --extra agentcore --dev
      - name: Install locked desktop dependencies
        run: npm ci --prefix apps/desktop --no-audit --no-fund
      - name: Python lint
        run: uv run --frozen ruff check services packages tests scripts
      - name: Windows native ACL smoke
        if: runner.os == 'Windows'
        run: >-
          uv run --frozen pytest -q
          tests/unit/test_codex_shared_transport.py::test_native_private_temp_acl_check_does_not_leak_handles
          tests/unit/test_codex_shared_transport.py::test_native_private_leaf_does_not_bypass_unsafe_ancestor_acl
      - name: Backend, adapters, policy and persistence
        run: uv run --frozen pytest -q -m "not live_llm and not live_codex and not live_opencode and not live_agentcore" --junitxml=build/test-results.xml
      - name: Desktop behavior and production build
        working-directory: apps/desktop
        run: |
          npm test
          npm run build
      - name: Retain test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.os }}
          path: build/test-results.xml
          if-no-files-found: warn

  native:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
            bridge: apps/desktop/src-tauri/binaries/pex-bridge-runtime/pex-bridge
          - os: windows-latest
            bundle: nsis
            bridge: apps/desktop/src-tauri/binaries/pex-bridge-runtime/pex-bridge.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
          enable-cache: true
      - name: Install pinned standalone Python
        run: uv python install
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl dbus-x11 file gnome-keyring libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev openbox patchelf scrot tesseract-ocr wget xauth xdotool xvfb
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install locked dependencies
        run: |
          uv sync --frozen --all-packages --extra agentcore --dev
          npm ci --prefix apps/desktop --no-audit --no-fund
      - name: Build native package
        working-directory: apps/desktop
        env:
          CARGO_BUILD_JOBS: '2'
        run: npm run tauri -- build --bundles ${{ matrix.bundle }}
      - name: Native bootstrap tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Verify bundled bridge startup and identity
        run: uv run --frozen python scripts/smoke_packaged_bridge.py --exe "${{ matrix.bridge }}" --output build/packaged-bridge-smoke.json
      - name: Verify native OS credential storage
        if: runner.os == 'Windows'
        run: uv run --frozen python scripts/smoke_native_keyring.py
      - name: Verify packaged Windows BYOK storage
        if: runner.os == 'Windows'
        run: uv run --frozen python scripts/smoke_packaged_bridge.py --exe "${{ matrix.bridge }}" --output build/packaged-byok-smoke.json --byok-roundtrip
      - name: Verify Linux Secret Service credential storage
        if: runner.os == 'Linux'
        run: dbus-run-session -- bash scripts/smoke_linux_keyring.sh "${{ matrix.bridge }}"
      - name: Verify installed Linux desktop window and bridge
        if: runner.os == 'Linux'
        run: bash scripts/smoke_linux_desktop.sh apps/desktop/src-tauri/target/release/bundle/deb/PEX_0.1.0_amd64.deb
      - name: Retain packages and startup receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.os }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            build/packaged-bridge-smoke.json
            build/packaged-byok-smoke.json
            build/linux-desktop-smoke.png
            build/linux-desktop-check-*.png
            build/linux-desktop-smoke.json
            build/linux-desktop-smoke.log
            build/linux-desktop-smoke-ocr.txt
            build/linux-desktop-settings.png
            build/linux-desktop-settings-ocr.txt
            build/linux-desktop-after-settings-click.png
            build/linux-desktop-after-settings-click-ocr.txt
            build/linux-desktop-identity-headers.txt
            build/linux-desktop-window-manager.log
            build/linux-desktop-window-geometry.txt
