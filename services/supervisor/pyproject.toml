[project]
name = "pex-supervisor"
version = "0.1.0"
description = "Strands/AgentCore supervisor for PEX."
requires-python = ">=3.11"
dependencies = [
  "pex-protocol",
  "strands-agents>=1.0",
  "pydantic>=2.10",
  "httpx>=0.27",
  "openai>=2.54.0",
  "anthropic>=1.0.0",
  "google-genai>=2.19.0",
  "ollama>=0.6.2",
  "litellm>=1.98.0",
]

[project.optional-dependencies]
agentcore = [
  "bedrock-agentcore>=0.1",
]

[project.scripts]
pex-supervisor = "pex_supervisor.runtime:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pex_supervisor"]

[tool.uv.sources]
pex-protocol = { workspace = true }
