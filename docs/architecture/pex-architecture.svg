<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PEX supervised-agent architecture</title>
  <desc id="desc">A local closed loop observes OpenCode or Codex workers, seals the goal's acceptance surface, extracts worker claims into a claim ledger, verifies them against workspace evidence with a Strands supervisor backed by a Nebius Token Factory NVIDIA Nemotron model, applies local policy, and journals rulings. Workers can call PEX back through a scoped MCP server; a replay pipeline re-runs recorded trajectories through the same adjudication. AgentCore, ConTree Sandboxes, and Tavily web evidence are shown as optional and key-gated.</desc>
  <defs>
    <style>
      .title{font:700 42px 'Segoe UI',Arial,sans-serif;fill:#f4faf7}.sub{font:400 20px 'Segoe UI',Arial,sans-serif;fill:#9eb3b7}
      .h{font:700 22px 'Segoe UI',Arial,sans-serif;fill:#f4faf7}.b{font:400 17px 'Segoe UI',Arial,sans-serif;fill:#b8c9cc}.small{font:600 15px 'Segoe UI',Arial,sans-serif;fill:#9eb3b7}
      .card{fill:#122229;stroke:#55727a;stroke-width:2}.core{fill:#11372f;stroke:#4ee0ad;stroke-width:2.5}.optional{fill:#28261d;stroke:#d5b253;stroke-width:2.5;stroke-dasharray:9 7}
      .container{fill:#0b171c;stroke:#36545d;stroke-width:2}.line{fill:none;stroke:#76939b;stroke-width:2.2}.accent{fill:none;stroke:#4ee0ad;stroke-width:2.6}.dash{fill:none;stroke:#d5b253;stroke-width:2.2;stroke-dasharray:8 7}
      .labelbg{fill:#071116}.green{fill:#55e4b3}.gold{fill:#e0bd63}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#76939b"/></marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4ee0ad"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d5b253"/></marker>
  </defs>

  <rect width="1600" height="900" fill="#071116"/>
  <circle cx="62" cy="61" r="13" fill="#35ddb0"/>
  <text x="88" y="72" class="title">PEX</text>
  <text x="190" y="69" class="sub">the independent supervisor above your coding agents</text>

  <rect x="48" y="152" width="300" height="120" rx="18" class="card"/>
  <text x="198" y="194" text-anchor="middle" class="h">Human</text>
  <text x="198" y="225" text-anchor="middle" class="b">seals goals</text>
  <text x="198" y="250" text-anchor="middle" class="b">rules on escalations</text>

  <rect x="48" y="332" width="300" height="134" rx="18" class="card"/>
  <text x="198" y="374" text-anchor="middle" class="h">PEX desktop</text>
  <text x="198" y="405" text-anchor="middle" class="b">Command Deck · Inspector · Pet</text>
  <text x="198" y="432" text-anchor="middle" class="b">replay · rulings · evidence packs</text>

  <rect x="48" y="618" width="300" height="132" rx="18" class="card"/>
  <text x="198" y="661" text-anchor="middle" class="h">Nebius Token Factory</text>
  <text x="198" y="693" text-anchor="middle" class="b">NVIDIA Nemotron model</text>
  <text x="198" y="719" text-anchor="middle" class="b">supervisor inference · key-gated</text>

  <rect x="398" y="124" width="790" height="696" rx="26" class="container"/>
  <text x="438" y="170" class="small">LOCAL PEX · IMPLEMENTED</text>

  <rect x="448" y="196" width="224" height="100" rx="16" class="core"/>
  <text x="560" y="239" text-anchor="middle" class="h">Bridge + adapters</text>
  <text x="560" y="269" text-anchor="middle" class="b">authenticated worker events</text>

  <rect x="692" y="196" width="224" height="100" rx="16" class="core"/>
  <text x="804" y="239" text-anchor="middle" class="h">Sealed acceptance</text>
  <text x="804" y="269" text-anchor="middle" class="b">baseline snapshot at attach</text>

  <rect x="936" y="196" width="224" height="100" rx="16" class="core"/>
  <text x="1048" y="228" text-anchor="middle" class="h">Claim ledger</text>
  <text x="1048" y="256" text-anchor="middle" class="b">narration is signal</text>
  <text x="1048" y="284" text-anchor="middle" class="b">never proof</text>

  <rect x="448" y="380" width="224" height="100" rx="16" class="core"/>
  <text x="560" y="412" text-anchor="middle" class="h">Strands supervisor</text>
  <text x="560" y="440" text-anchor="middle" class="b">semantic proposal on</text>
  <text x="560" y="468" text-anchor="middle" class="b">redacted evidence</text>

  <rect x="692" y="380" width="224" height="100" rx="16" class="core"/>
  <text x="804" y="412" text-anchor="middle" class="h">Independent verifier</text>
  <text x="804" y="440" text-anchor="middle" class="b">files · diffs · test exits</text>
  <text x="804" y="468" text-anchor="middle" class="b">staleness · tamper</text>

  <rect x="936" y="380" width="224" height="100" rx="16" class="core"/>
  <text x="1048" y="412" text-anchor="middle" class="h">MCP server /mcp/</text>
  <text x="1048" y="440" text-anchor="middle" class="b">8 tools · 5 scopes</text>
  <text x="1048" y="468" text-anchor="middle" class="b">session-bound credentials</text>

  <rect x="448" y="564" width="224" height="100" rx="16" class="core"/>
  <text x="560" y="607" text-anchor="middle" class="h">Local policy guard</text>
  <text x="560" y="637" text-anchor="middle" class="b">nudge · ask human · noop</text>

  <rect x="692" y="564" width="224" height="100" rx="16" class="card"/>
  <text x="804" y="598" text-anchor="middle" class="h" font-size="19">Audit ledger</text>
  <text x="804" y="626" text-anchor="middle" class="small">claims · interventions</text>
  <text x="804" y="654" text-anchor="middle" class="small">rulings</text>

  <rect x="936" y="564" width="224" height="100" rx="16" class="core"/>
  <text x="1048" y="596" text-anchor="middle" class="h">Replay pipeline</text>
  <text x="1048" y="624" text-anchor="middle" class="b">deterministic trajectories</text>
  <text x="1048" y="652" text-anchor="middle" class="b">not live control</text>

  <rect x="1252" y="190" width="300" height="146" rx="20" class="core"/>
  <text x="1402" y="234" text-anchor="middle" class="h">Existing coding worker</text>
  <text x="1402" y="270" text-anchor="middle" class="b">OpenCode serve</text>
  <text x="1402" y="297" text-anchor="middle" class="b">Codex App Server</text>

  <rect x="1252" y="480" width="300" height="100" rx="20" class="optional"/>
  <text x="1402" y="512" text-anchor="middle" class="h">AgentCore Runtime</text>
  <text x="1402" y="540" text-anchor="middle" class="b">implemented + locally tested</text>
  <text x="1402" y="568" text-anchor="middle" class="h gold" font-size="15">NOT DEPLOYED</text>

  <rect x="1252" y="620" width="300" height="80" rx="20" class="optional"/>
  <text x="1402" y="646" text-anchor="middle" class="h">Nebius ConTree</text>
  <text x="1402" y="671" text-anchor="middle" class="b">isolated pytest VMs</text>
  <text x="1402" y="695" text-anchor="middle" class="h gold" font-size="15">KEY-GATED (beta)</text>

  <rect x="1252" y="740" width="300" height="90" rx="20" class="optional"/>
  <text x="1402" y="766" text-anchor="middle" class="h">Tavily web evidence</text>
  <text x="1402" y="791" text-anchor="middle" class="b">public-claim checks</text>
  <text x="1402" y="816" text-anchor="middle" class="h gold" font-size="15">KEY-GATED</text>

  <path d="M198 272V332" class="line" marker-end="url(#arrow)"/>
  <path d="M348 399H430V246H448" class="line" marker-end="url(#arrow)"/>
  <rect x="313" y="372" width="174" height="26" rx="5" class="labelbg"/>
  <text x="400" y="390" text-anchor="middle" class="small">sealed goal + rulings</text>

  <path d="M672 246H692" class="accent" marker-end="url(#arrowAccent)"/>
  <path d="M916 246H936" class="accent" marker-end="url(#arrowAccent)"/>
  <path d="M990 296V345H804V380" class="accent" marker-end="url(#arrowAccent)"/>
  <rect x="827" y="326" width="136" height="26" rx="5" class="labelbg"/>
  <text x="895" y="344" text-anchor="middle" class="small">claims extracted</text>
  <path d="M692 430H672" class="accent" marker-end="url(#arrowAccent)"/>
  <path d="M580 480V564" class="accent" marker-end="url(#arrowAccent)"/>
  <rect x="595" y="509" width="106" height="26" rx="5" class="labelbg"/>
  <text x="648" y="527" text-anchor="middle" class="small">typed action</text>
  <path d="M672 614H692" class="line" marker-end="url(#arrow)"/>
  <path d="M1048 564V540H804V480" class="accent" marker-end="url(#arrowAccent)"/>
  <rect x="838" y="519" width="174" height="26" rx="5" class="labelbg"/>
  <text x="925" y="537" text-anchor="middle" class="small">recorded trajectories</text>
  <path d="M1048 380V296" class="line" marker-end="url(#arrow)"/>
  <rect x="991" y="305" width="114" height="26" rx="5" class="labelbg"/>
  <text x="1048" y="323" text-anchor="middle" class="small">scoped writes</text>

  <path d="M1252 232H1210V150H560V196" class="line" marker-end="url(#arrow)"/>
  <rect x="816" y="131" width="128" height="26" rx="5" class="labelbg"/>
  <text x="880" y="149" text-anchor="middle" class="small">observed events</text>
  <path d="M1402 336V430H1160" class="accent" marker-end="url(#arrowAccent)"/>
  <rect x="1191" y="409" width="188" height="26" rx="5" class="labelbg"/>
  <text x="1285" y="427" text-anchor="middle" class="small green">8 tools · session-bound</text>
  <path d="M560 664V722H1210V290H1252" class="accent" marker-end="url(#arrowAccent)"/>
  <rect x="793" y="701" width="174" height="26" rx="5" class="labelbg"/>
  <text x="880" y="719" text-anchor="middle" class="small green">authorized correction</text>

  <path d="M448 614H382V421H348" class="line" marker-end="url(#arrow)"/>
  <rect x="350" y="593" width="128" height="26" rx="5" class="labelbg"/>
  <text x="414" y="611" text-anchor="middle" class="small">decision needed</text>
  <path d="M500 480V502H370V684H348" class="line" marker-end="url(#arrow)"/>
  <rect x="371" y="483" width="128" height="26" rx="5" class="labelbg"/>
  <text x="435" y="501" text-anchor="middle" class="small">model inference</text>

  <path d="M560 196V132H1430V480" class="dash" marker-end="url(#arrowGold)"/>
  <rect x="907" y="113" width="166" height="26" rx="5" class="labelbg"/>
  <text x="990" y="131" text-anchor="middle" class="small gold">optional remote path</text>
  <path d="M1252 530H1245V556H620V480" class="dash" marker-end="url(#arrowGold)"/>
  <path d="M916 400H928V355H1240V660H1252" class="dash" marker-end="url(#arrowGold)"/>
  <rect x="1021" y="336" width="128" height="26" rx="5" class="labelbg"/>
  <text x="1085" y="354" text-anchor="middle" class="small gold">isolated pytest</text>
  <path d="M672 462H685V505H1230V785H1252" class="dash" marker-end="url(#arrowGold)"/>
  <rect x="867" y="486" width="166" height="26" rx="5" class="labelbg"/>
  <text x="950" y="504" text-anchor="middle" class="small gold">bounded web evidence</text>

  <text x="48" y="850" class="sub">Worker claims → sealed surface → evidence → verdict → durable ruling</text>
  <text x="1552" y="850" text-anchor="end" class="sub">Typed actions. Local policy stays authoritative.</text>
</svg>
