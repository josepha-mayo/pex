[project]
name = "pex-managed-transport-candidate"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "httpcore==1.0.9"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
