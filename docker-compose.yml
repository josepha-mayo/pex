services:
  supervisor:
    build:
      context: .
      dockerfile: deploy/agentcore/Dockerfile
    image: pex-supervisor:agentcore-arm64
    platform: linux/arm64
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      PORT: "8080"
      PEX_RUNTIME_SERVER: "local_http"
      PEX_RUNTIME_HOST: "0.0.0.0"
    # This is a local HTTP-contract smoke only. It does not prove AWS deployment.
